schema_version: 1

context:
  name: wagtail-markdown
  version: "0.15.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/wagtail_markdown-${{ version }}.tar.gz
  sha256: 08d58177a6f015c99d2597f681d6f8c276df5d7f74721ab24996d4582a2426da

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.2,<5
    - pip
  run:
    - python >=${{ python_min }}
    - wagtail >=7.0
    - markdown >=3.3,<4
    - nh3 >=0.3.4

tests:
  - python:
      imports:
        - wagtailmarkdown
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/torchbox/wagtail-markdown
  summary: Markdown support for Wagtail
  license: Unlicense
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
